services:
  triaxa:
    build: .
    image: triaxa:latest
    container_name: triaxa
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Reach LM Studio / Ollama running on the host machine
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - triaxa-data:/data
    restart: unless-stopped

volumes:
  triaxa-data:
