<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triaxa</title>
<meta name="description" content="Triaxa sorts support tickets by category, urgency and next step using an LLM.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F3A5F'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E7ECF0; --surface: #F6F8FA; --raised: #FFFFFF; --ink: #16202A; --muted: #586674;
  --line: #CFD7DF; --brand: #1F3A5F; --brand-ink: #FFFFFF; --focus: #2C74AE;
  --urgent: #C42F3A; --high: #A86F00; --medium: #2C74AE; --low: #3D7C50; --incoming: #66727F;
  --shadow: 0 1px 2px rgba(22, 32, 42, .08), 0 4px 14px rgba(22, 32, 42, .06);
  --font: "Archivo", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #131B24; --raised: #19232E; --ink: #E3E8ED; --muted: #94A1AE;
    --line: #26323F; --brand: #8DB4E2; --brand-ink: #0D131A; --focus: #8DB4E2;
    --urgent: #F06B73; --high: #E2AA3B; --medium: #6CA9E0; --low: #7CC08F; --incoming: #94A1AE;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #131B24; --raised: #19232E; --ink: #E3E8ED; --muted: #94A1AE;
  --line: #26323F; --brand: #8DB4E2; --brand-ink: #0D131A; --focus: #8DB4E2;
  --urgent: #F06B73; --high: #E2AA3B; --medium: #6CA9E0; --low: #7CC08F; --incoming: #94A1AE;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); font-variation-settings: "wdth" 100;
  -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 16px; padding: 14px clamp(16px, 3vw, 32px);
  border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 20; }
@media (max-width: 720px) { .top { position: static; } }
.wordmark { display: flex; align-items: baseline; gap: 10px; margin-right: auto; text-decoration: none; color: inherit; }
.wordmark b { font-size: 22px; font-weight: 800; font-variation-settings: "wdth" 125; letter-spacing: .02em; }
.wordmark span { color: var(--muted); font-size: 13px; }
@media (max-width: 560px) { .wordmark span { display: none; } }
.conn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raised);
  border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13.5px; cursor: pointer; max-width: 46vw; }
.conn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn .led { width: 9px; height: 9px; border-radius: 50%; background: var(--incoming); flex: none; }
.conn[data-state="ok"] .led { background: var(--low); }
.conn[data-state="demo"] .led { background: var(--medium); }
.conn[data-state="bad"] .led { background: var(--urgent); }
.icon-btn { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; width: 36px; height: 36px;
  display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }

/* ---------- layout ---------- */
.wrap { max-width: 1480px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 32px) 48px; }

/* ---------- composer ---------- */
.composer { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; background: var(--raised);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
@media (max-width: 820px) { .composer { grid-template-columns: minmax(0, 1fr); } }
.composer textarea { width: 100%; min-height: 108px; resize: vertical; border: 0; background: transparent;
  font-size: 16px; line-height: 1.55; padding: 4px 2px; }
.composer textarea:focus { outline: none; }
.composer textarea::placeholder { color: var(--muted); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.examples > span { color: var(--muted); font-size: 13px; margin-right: 2px; }
.chip { border: 1px dashed var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px;
  font-size: 13px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); border-style: solid; }
.side { display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--line); padding-left: 16px; }
@media (max-width: 820px) { .side { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 12px; } }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 9px 14px;
  font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--urgent); }
.btn.danger.armed { background: var(--urgent); border-color: var(--urgent); color: #fff; }
.btn:disabled { opacity: .55; cursor: progress; }
.btn kbd { font: inherit; font-size: 12px; opacity: .75; font-weight: 500; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.count { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }

/* instant result: a printed triage tag */
.instant { margin-top: 14px; display: none; }
.instant.show { display: block; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; margin: 28px 0 14px; flex-wrap: wrap; }
.toolbar h2 { font-size: 26px; line-height: 1.1; font-weight: 800; font-variation-settings: "wdth" 118; margin: 0 auto 0 0; }
.toolbar h2 small { display: block; font-size: 13.5px; font-weight: 400; color: var(--muted); font-variation-settings: "wdth" 100; margin-top: 4px; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--muted); }
.search input { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 10px 8px 32px; width: 230px; }
.toolbar select { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 8px 10px; }
@media (max-width: 720px) { .search { flex: 1 1 100%; order: 3; } .search input { width: 100%; } .toolbar h2 { flex: 1 1 100%; } }

/* ---------- board ---------- */
.lanetabs { display: none; }
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 1180px) { .board { overflow-x: auto; grid-template-columns: repeat(5, 250px); padding-bottom: 8px; } }
.lane { --tone: var(--incoming); background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  min-height: 180px; display: flex; flex-direction: column; }
.lane[data-lane="Urgent"] { --tone: var(--urgent); }
.lane[data-lane="High"] { --tone: var(--high); }
.lane[data-lane="Medium"] { --tone: var(--medium); }
.lane[data-lane="Low"] { --tone: var(--low); }
.lane header { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 10px;
  border-bottom: 3px solid var(--tone); }
.lane h3 { margin: 0; font-size: 17px; font-weight: 750; font-variation-settings: "wdth" 120; color: var(--tone); }
.lane h3 + p { margin: 0; color: var(--muted); font-size: 12px; }
.lane .n { font-size: 28px; font-weight: 800; font-variation-settings: "wdth" 80; font-variant-numeric: tabular-nums; line-height: 1; }
.lane ol { list-style: none; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.lane .none { color: var(--muted); font-size: 13px; padding: 14px; text-align: center; }

.card { --tone: var(--incoming); width: 100%; text-align: left; cursor: pointer; background: var(--raised);
  border: 1px solid var(--line); border-left: 5px solid var(--tone); border-radius: 10px; padding: 10px 12px 10px 14px;
  position: relative; display: block; }
.card:hover { border-color: var(--muted); border-left-color: var(--tone); }
.card[aria-current="true"] { outline: 2px solid var(--focus); outline-offset: 1px; }
.card::before { content: ""; position: absolute; left: -5px; top: 12px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--tone); translate: -1px 0; }
.card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.card .cat { font-weight: 650; color: var(--ink); }
.card p { margin: 4px 0 0; font-size: 14px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.card .state.failed { color: var(--urgent); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--medium); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.card.fresh { animation: land .5s ease-out; }
@keyframes land { from { background: color-mix(in srgb, var(--tone) 18%, var(--raised)); } }

.empty { grid-column: 1 / -1; text-align: center; padding: 48px 16px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 18px; margin: 0 0 6px; font-variation-settings: "wdth" 115; }
.empty p { margin: 0 auto 14px; max-width: 46ch; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }

@media (max-width: 720px) {
  .lanetabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
  .lanetabs button { flex: none; border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }
  .lanetabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .board { display: block; overflow: visible; }
  .lane { display: none; }
  .lane.active { display: flex; }
}

/* ---------- tag (used by drawer + instant result) ---------- */
.tag { --tone: var(--incoming); border: 1px solid var(--line); border-top: 6px solid var(--tone); background: var(--raised); border-radius: 12px; padding: 14px 16px; }
.tag .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag .urg { font-size: 22px; font-weight: 800; font-variation-settings: "wdth" 120; color: var(--tone); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; }
.tag dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 12px; margin: 12px 0 0; font-size: 14.5px; }
.tag dt { color: var(--muted); }
.tag dd { margin: 0; overflow-wrap: anywhere; }
.tag .note { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(13, 19, 26, .38); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--surface);
  border-left: 1px solid var(--line); z-index: 31; transform: translateX(100%); transition: transform .22s ease-out;
  display: flex; flex-direction: column; }
.drawer.open { transform: none; box-shadow: -10px 0 40px rgba(0, 0, 0, .15); }
.drawer .dh { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .dh h2 { margin: 0 auto 0 0; font-size: 16px; font-weight: 700; }
.drawer .db { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.drawer .quote { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; font-size: 14.5px; }
.drawer h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.drawer .meta { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; margin: 0; }
.drawer .meta dt { color: var(--muted); }
.drawer .meta dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.drawer pre { margin: 0; font-size: 12.5px; white-space: pre-wrap; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.drawer .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 16px; border-top: 1px solid var(--line); margin-top: auto; }
.err { color: var(--urgent); }

/* ---------- settings dialog ---------- */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(13, 19, 26, .45); }
dialog form { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
dialog h2 { margin: 0; font-size: 20px; font-variation-settings: "wdth" 115; }
dialog p { margin: 0; color: var(--muted); font-size: 14px; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--raised); }
.choice:has(input:checked) { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.choice input { margin-top: 4px; accent-color: var(--brand); }
.choice b { display: block; }
.choice span { color: var(--muted); font-size: 13.5px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.field input { border: 1px solid var(--line); background: var(--raised); border-radius: 10px; padding: 9px 11px; font-size: 15px; }
.server-fields { display: flex; flex-direction: column; gap: 10px; }
.server-fields[hidden] { display: none; }
.dlg-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dlg-actions .spacer { flex: 1; }
.test-result { flex-basis: 100%; font-size: 13.5px; min-height: 1.4em; }

/* ---------- toasts ---------- */
.toasts { position: fixed; bottom: 16px; left: 50%; translate: -50% 0; display: flex; flex-direction: column; gap: 8px; z-index: 50; width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
.toast.bad { background: var(--urgent); color: #fff; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.banner { display: none; margin: 0 0 16px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); font-size: 14px; }
.banner.show { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner b { font-weight: 650; }
.banner > span { flex: 1 1 320px; }
.banner .btns { display: flex; gap: 8px; }
.banner .btn { padding: 5px 10px; font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <a class="wordmark" href="./"><b>TRIAXA</b><span>Support ticket triage</span></a>
  <button class="conn" id="conn" type="button" data-state="" aria-label="Connection settings">
    <span class="led"></span><span id="conn-label">Connecting…</span>
  </button>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch theme"></button>
</header>

<div class="wrap">
  <div class="banner" id="banner" role="status"></div>

  <section class="composer" aria-label="New tickets">
    <div>
      <label class="sr" for="text">Ticket text</label>
      <textarea id="text" placeholder="Paste a support ticket, email or chat message…"></textarea>
      <div class="examples" id="examples"><span>Try one:</span></div>
      <div class="instant" id="instant" aria-live="polite"></div>
    </div>
    <div class="side">
      <div class="seg" role="group" aria-label="Input mode">
        <button type="button" id="mode-one" aria-pressed="true">One ticket</button>
        <button type="button" id="mode-many" aria-pressed="false">One per line</button>
      </div>
      <button class="btn primary" id="queue" type="button">Add to board <kbd id="kbd">⌘↵</kbd></button>
      <button class="btn" id="analyze" type="button">Triage now, don't save</button>
      <p class="hint" id="mode-hint">Added tickets are triaged in the background and land in a lane on the board.</p>
      <div class="count" id="count"></div>
    </div>
  </section>

  <section aria-labelledby="board-title">
    <div class="toolbar">
      <h2 id="board-title">Triage board<small id="summary">&nbsp;</small></h2>
      <label class="search"><span class="sr">Search tickets</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search tickets  ( / )">
      </label>
      <label><span class="sr">Category</span>
        <select id="category"><option value="">All categories</option><option>Billing</option><option>Technical</option>
          <option>Account</option><option>Sales</option><option>Feedback</option><option>General</option></select>
      </label>
      <button class="btn" id="export" type="button">Export CSV</button>
    </div>
    <div class="lanetabs" id="lanetabs" role="tablist" aria-label="Lanes"></div>
    <div class="board" id="board"></div>
    <div class="foot"><span id="foot-left"></span><span id="foot-right"></span></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="dh">
    <h2 id="drawer-title">Ticket</h2>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="Close details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="db" id="drawer-body"></div>
  <div class="actions" id="drawer-actions"></div>
</aside>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" id="settings-form">
    <h2 id="settings-title">Where Triaxa runs</h2>
    <p>Demo mode works anywhere, including GitHub Pages. To use a real language model, run the Triaxa server and connect to it.</p>
    <label class="choice"><input type="radio" name="mode" value="demo">
      <div><b>Demo in this browser</b><span>A built-in keyword classifier. Tickets are kept on this device only.</span></div></label>
    <label class="choice"><input type="radio" name="mode" value="server">
      <div><b>Triaxa server</b><span>Your own server with LM Studio, Ollama or OpenAI. Shared history, retries and webhooks.</span></div></label>
    <div class="server-fields" id="server-fields">
      <label class="field">Server address
        <input id="s-url" type="url" placeholder="http://127.0.0.1:8000" autocomplete="off" spellcheck="false"></label>
      <label class="field">API key <span class="hint">Only if the server sets API_KEY.</span>
        <input id="s-key" type="password" autocomplete="off"></label>
    </div>
    <div class="dlg-actions">
      <span class="test-result" id="test-result" aria-live="polite"></span>
      <button class="btn" type="button" id="s-test">Test connection</button>
      <span class="spacer"></span>
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancel</button>
      <button class="btn primary" value="save" type="submit" id="s-save">Save</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================================
   Storage helpers (storage may be unavailable: private mode, previews)
   ========================================================================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MAX_TEXT = 20000;
const LANES = ["Incoming", "Urgent", "High", "Medium", "Low"];
const LANE_HINT = { Incoming: "Waiting, working or failed", Urgent: "Respond now", High: "Customer is blocked",
  Medium: "Degraded or time-sensitive", Low: "Questions and requests" };

/* =========================================================================
   In-browser analyzer (mirrors app/llm.py MockAnalyzer)
   ========================================================================= */
const RULES = [
  ["Billing", /invoice|bill|charg|refund|payment|price|subscription|plan|card|upgrade|downgrade/],
  ["Account", /password|login|log in|sign in|account|2fa|locked|email address|username/],
  ["Technical", /error|bug|crash|broken|not working|doesn't work|down|outage|slow|500|timeout|api/],
  ["Sales", /demo|quote|pricing for|enterprise|purchase|buy|licen[cs]e/],
  ["Feedback", /love|great|suggest|feature request|would be nice|feedback|hate/],
];
const ACTIONS = {
  Billing: "Review the customer's billing record and respond about the requested change.",
  Account: "Verify the customer's identity and help them regain access to the account.",
  Technical: "Reproduce the reported problem and escalate to engineering if confirmed.",
  Sales: "Route to the sales team to follow up with the prospect.",
  Feedback: "Thank the customer and log the feedback for the product team.",
  General: "Reply to the customer to clarify their request.",
};
function analyzeLocal(text) {
  const t = text.toLowerCase();
  const category = (RULES.find(([, rx]) => rx.test(t)) || ["General"])[0];
  const urgency = /outage|(is|are|been|went|goes) down|down for|data loss|security|breach|hacked|asap|immediately|lawsuit|every (api )?(call|request)|all (of our )?(users|customers)|returns? 5\d\d|\b50[0-4]\b/.test(t) ? "Urgent"
    : /can't|cannot|unable|blocked|not working|broken|crash|locked out|charged twice|urgent/.test(t) ? "High"
    : /slow|error|wrong|incorrect|double charge|overcharg|today|deadline|soon/.test(t) ? "Medium" : "Low";
  const sentiment = /angry|frustrat|terrible|awful|hate|unacceptable|disappoint|annoy|worst|ridiculous/.test(t) ? "Negative"
    : /thank|love|great|awesome|appreciate|excellent|happy/.test(t) ? "Positive" : "Neutral";
  const first = text.trim().split(/(?<=[.!?])\s+/)[0];
  return { category, urgency, sentiment, summary: first.length <= 200 ? first : first.slice(0, 197) + "...", action_item: ACTIONS[category] };
}

/* =========================================================================
   Backends: same interface, two implementations
   ========================================================================= */
class DemoBackend {
  constructor(onChange) {
    this.kind = "demo"; this.onChange = onChange; this.queue = []; this.active = 0;
    this.jobs = store.get("triaxa.demo.jobs", []);
    for (const j of this.jobs) if (j.status === "queued" || j.status === "processing") { j.status = "queued"; this.queue.push(j.id); }
    this.pump();
  }
  save() { store.set("triaxa.demo.jobs", this.jobs); }
  find(id) { return this.jobs.find((j) => j.id === id); }
  check(text) {
    if (!text || !text.trim()) throw new Error("Write or paste a ticket first.");
    if (text.length > MAX_TEXT) throw new Error(`Tickets can be up to ${MAX_TEXT.toLocaleString()} characters.`);
  }
  async ready() { return { ok: true, label: "Demo mode", detail: "Runs in this browser" }; }
  async analyze(text) { this.check(text); await sleep(300); return analyzeLocal(text); }
  async create(texts) {
    texts.forEach((t) => this.check(t));
    const now = Date.now();
    const made = texts.map((text, i) => ({
      id: crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : String(now + i) + Math.random().toString(16).slice(2),
      status: "queued", text, result: null, error: null, attempts: 0, metadata: {},
      created_at: new Date(now + i).toISOString(), updated_at: new Date(now + i).toISOString(), completed_at: null, duration_ms: null,
    }));
    this.jobs.unshift(...made.slice().reverse());
    made.forEach((j) => this.queue.push(j.id));
    this.save(); this.pump();
    return made;
  }
  pump() {
    while (this.active < 2 && this.queue.length) {
      const job = this.find(this.queue.shift());
      if (!job) continue;
      this.active++; job.status = "processing"; job.attempts++; this.save();
      const started = performance.now(), id = job.id;
      setTimeout(() => {
        const j = this.find(id);
        if (j) {
          j.result = analyzeLocal(j.text); j.status = "completed";
          j.duration_ms = Math.round(performance.now() - started);
          j.completed_at = j.updated_at = new Date().toISOString(); this.save();
        }
        this.active--; this.onChange(id); this.pump();
      }, 450 + Math.random() * 900);
    }
    this.onChange();
  }
  async list({ q, category, limit }) {
    const needle = (q || "").toLowerCase();
    const items = this.jobs.filter((j) => (!category || j.result?.category === category)
      && (!needle || j.text.toLowerCase().includes(needle) || (j.result?.summary || "").toLowerCase().includes(needle)));
    return { items: items.slice(0, limit), total: items.length };
  }
  async get(id) { const j = this.find(id); if (!j) throw new Error("This ticket no longer exists."); return j; }
  async retry(id) {
    const j = this.find(id); if (!j) throw new Error("This ticket no longer exists.");
    Object.assign(j, { status: "queued", result: null, error: null, attempts: 0, completed_at: null, duration_ms: null, updated_at: new Date().toISOString() });
    this.queue.push(id); this.save(); this.pump(); return j;
  }
  async remove(id) { this.jobs = this.jobs.filter((j) => j.id !== id); this.save(); }
  async stats() {
    const done = this.jobs.filter((j) => j.status === "completed");
    const avg = done.length ? done.reduce((s, j) => s + j.duration_ms, 0) / done.length : null;
    return { total: this.jobs.length, avg_duration_ms: avg, queue_depth: this.queue.length + this.active };
  }
}

class ServerBackend {
  constructor(base, key) { this.kind = "server"; this.base = base.replace(/\/+$/, ""); this.key = key; }
  async req(path, opts = {}, timeout = 20000) {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), timeout);
    const headers = { "Content-Type": "application/json" };
    if (this.key) headers["X-API-Key"] = this.key;
    let res;
    try { res = await fetch(this.base + path, { ...opts, headers, signal: ctrl.signal }); }
    catch (e) { throw new Error(e.name === "AbortError" ? "The server took too long to answer." : `Can't reach the server at ${this.base || location.origin}.`); }
    finally { clearTimeout(timer); }
    if (res.status === 204) return null;
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401) throw new Error("The server needs an API key. Add it in connection settings.");
      const d = body.detail;
      throw new Error(Array.isArray(d) ? d.map((x) => x.msg).join("; ") : d || `Server answered ${res.status}.`);
    }
    return body;
  }
  async ready() {
    try {
      const r = await fetch(this.base + "/health/ready", { headers: this.key ? { "X-API-Key": this.key } : {} });
      const b = await r.json();
      const llm = b.llm || {};
      if (!llm.ok) return { ok: false, label: "Model offline", detail: llm.error || "The model server isn't reachable." };
      const model = llm.provider === "mock" ? "Mock analyzer" : (llm.model === "auto" ? (llm.available_models || [])[0] || "auto" : llm.model);
      return { ok: true, label: model, detail: llm.base_url || "" };
    } catch { return { ok: false, label: "Server unreachable", detail: `No answer from ${this.base || location.origin}.`, down: true }; }
  }
  analyze(text) { return this.req("/analyze", { method: "POST", body: JSON.stringify({ text }) }, 300000); }
  create(texts) {
    if (texts.length === 1) return this.req("/jobs", { method: "POST", body: JSON.stringify({ text: texts[0] }) }).then((j) => [j]);
    return this.req("/jobs/batch", { method: "POST", body: JSON.stringify({ items: texts.map((text) => ({ text })) }) });
  }
  list({ q, category, limit }) {
    const p = new URLSearchParams({ limit }); if (q) p.set("q", q); if (category) p.set("category", category);
    return this.req(`/jobs?${p}`);
  }
  get(id) { return this.req(`/jobs/${id}`); }
  retry(id) { return this.req(`/jobs/${id}/retry`, { method: "POST" }); }
  remove(id) { return this.req(`/jobs/${id}`, { method: "DELETE" }); }
  stats() { return this.req("/stats"); }
}

const S = {
  backend: null, jobs: [], total: 0, selected: null, lane: "Incoming", many: false,
  seen: new Map(), firstLoad: true, health: null, refreshing: false,
};
const LIMIT = 300;

const EXAMPLES = [
  ["Outage", "Our production dashboard has been down for 20 minutes and every API call returns 500. Customers are complaining!"],
  ["Double charge", "I was charged twice for my Pro subscription this month. Please refund the duplicate payment."],
  ["Locked out", "I can't log in — it says my account is locked after I reset my password."],
  ["Sales lead", "Could someone send me a quote for 50 enterprise seats? We'd like to buy before the end of the quarter."],
  ["Kind words", "Just wanted to say the new export feature is great, thanks team!"],
  ["Slow app", "The reports page has been really slow today, takes about a minute to load."],
];

/* ---------- connection ---------- */
function savedConn() { return store.get("triaxa.conn", null); }

async function probeSameOrigin() {
  // Static hosts (GitHub Pages, opening the file directly) have no API to find.
  if (location.protocol === "file:" || location.hostname.endsWith("github.io")) return false;
  try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch("health", { signal: ctrl.signal, cache: "no-store" });
    if (!r.ok) return false;
    const b = await r.json();
    return b && b.status === "healthy";
  } catch { return false; }
}

async function connect() {
  const conn = savedConn();
  if (conn?.mode === "server") S.backend = new ServerBackend(conn.url || "", conn.key || "");
  else if (conn?.mode === "demo") S.backend = new DemoBackend(onDemoChange);
  else S.backend = (await probeSameOrigin()) ? new ServerBackend(new URL(".", location.href).href, "") : new DemoBackend(onDemoChange);
  await checkHealth();
  await refresh();
}

async function checkHealth() {
  const h = await S.backend.ready();
  S.health = h;
  const pill = $("conn");
  pill.dataset.state = S.backend.kind === "demo" ? "demo" : h.ok ? "ok" : "bad";
  $("conn-label").textContent = S.backend.kind === "demo" ? "Demo mode" : h.label;
  pill.title = `${h.detail || ""} (click to change)`.trim();
  const banner = $("banner");
  if (S.backend.kind === "demo" && !store.get("triaxa.demoBannerClosed", false)) {
    banner.innerHTML = `<span><b>You're in demo mode.</b> Triage runs in your browser with a keyword classifier. Connect a Triaxa server to use a real language model.</span>
      <span class="btns"><button class="btn" type="button" data-act="open-settings">Connect a server</button><button class="btn" type="button" data-act="close-banner">Dismiss</button></span>`;
    banner.classList.add("show");
  } else if (S.backend.kind === "server" && !h.ok) {
    banner.innerHTML = `<span><b>${esc(h.label)}.</b> ${esc(h.detail)} ${h.down ? "Start it with <code>uvicorn main:app --port 8000</code>, or switch to demo mode." : "Start LM Studio's server, or set LLM_PROVIDER=mock."}</span>
      <span class="btns"><button class="btn" type="button" data-act="open-settings">Connection settings</button></span>`;
    banner.classList.add("show");
  } else banner.classList.remove("show");
}

$("banner").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "open-settings") openSettings();
  if (act === "close-banner") { store.set("triaxa.demoBannerClosed", true); $("banner").classList.remove("show"); }
});

/* ---------- data refresh ---------- */
function onDemoChange(doneId) {
  if (doneId) S.seen.delete(doneId);
  scheduleRender();
}
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; refresh(); });
}

async function refresh() {
  if (S.refreshing || !S.backend) return;
  S.refreshing = true;
  try {
    const [list, stats] = await Promise.all([
      S.backend.list({ q: $("q").value.trim(), category: $("category").value, limit: LIMIT }),
      S.backend.stats(),
    ]);
    S.jobs = list.items; S.total = list.total;
    renderBoard(); renderSummary(stats);
    if (S.selected) {
      const j = S.jobs.find((x) => x.id === S.selected);
      if (j) renderDrawer(j);
    }
  } catch (e) {
    $("board").innerHTML = `<div class="empty"><h3>Can't load the board</h3><p>${esc(e.message)}</p>
      <button class="btn" type="button" onclick="openSettings()">Connection settings</button></div>`;
  } finally { S.refreshing = false; }
}

function laneOf(j) { return j.status === "completed" && j.result ? j.result.urgency : "Incoming"; }

const ago = (iso) => {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
};

function cardHTML(j) {
  const lane = laneOf(j);
  const tone = lane === "Incoming" ? (j.status === "failed" ? "var(--urgent)" : "var(--incoming)") : `var(--${lane.toLowerCase()})`;
  const prev = S.seen.get(j.id);
  const fresh = !S.firstLoad && prev !== undefined && prev !== j.status && j.status === "completed";
  S.seen.set(j.id, j.status);
  let top, body;
  if (j.status === "completed" && j.result) {
    top = `<span class="cat">${esc(j.result.category)}</span><span>${ago(j.created_at)}</span>`;
    body = esc(j.result.summary);
  } else {
    const label = { queued: "Waiting", processing: "Triaging", failed: "Failed" }[j.status];
    top = `<span class="state ${j.status}">${j.status === "processing" ? '<span class="pulse"></span>' : ""}${label}</span><span>${ago(j.created_at)}</span>`;
    body = esc(j.text);
  }
  return `<li><button class="card${fresh ? " fresh" : ""}" type="button" data-id="${j.id}" style="--tone:${tone}"
    ${S.selected === j.id ? 'aria-current="true"' : ""}><span class="row">${top}</span><p>${body}</p></button></li>`;
}

function renderBoard() {
  const board = $("board");
  const filtered = $("q").value.trim() || $("category").value;
  if (!S.jobs.length) {
    $("lanetabs").innerHTML = "";
    board.innerHTML = filtered
      ? `<div class="empty"><h3>No tickets match</h3><p>Try another search term or category.</p>
          <button class="btn" type="button" data-act="clear-filters">Clear filters</button></div>`
      : `<div class="empty"><h3>The board is empty</h3><p>Paste a ticket above, or add a few sample tickets to see how Triaxa sorts them by urgency.</p>
          <button class="btn primary" type="button" data-act="samples">Add 6 sample tickets</button></div>`;
    S.firstLoad = false;
    return;
  }
  const groups = Object.fromEntries(LANES.map((l) => [l, []]));
  for (const j of S.jobs) groups[laneOf(j)].push(j);
  if (!groups[S.lane].length) S.lane = LANES.find((l) => groups[l].length) || "Incoming";
  $("lanetabs").innerHTML = LANES.map((l) => `<button type="button" role="tab" data-lane="${l}" aria-selected="${l === S.lane}">${l} ${groups[l].length}</button>`).join("");
  board.innerHTML = LANES.map((l) => `
    <section class="lane${l === S.lane ? " active" : ""}" data-lane="${l}" aria-label="${l}">
      <header><div><h3>${l}</h3><p>${LANE_HINT[l]}</p></div><span class="n">${groups[l].length}</span></header>
      ${groups[l].length ? `<ol>${groups[l].map(cardHTML).join("")}</ol>` : `<div class="none">Nothing here</div>`}
    </section>`).join("");
  S.firstLoad = false;
}

function renderSummary(stats) {
  const avg = stats.avg_duration_ms == null ? null
    : stats.avg_duration_ms >= 1000 ? `${(stats.avg_duration_ms / 1000).toFixed(1)} s` : `${Math.round(stats.avg_duration_ms)} ms`;
  const parts = [`${stats.total} ticket${stats.total === 1 ? "" : "s"}`];
  if (stats.queue_depth) parts.push(`${stats.queue_depth} in progress`);
  if (avg) parts.push(`average ${avg} each`);
  $("summary").textContent = parts.join(", ");
  $("foot-left").textContent = S.total > S.jobs.length ? `Showing the latest ${S.jobs.length} of ${S.total} matching tickets.` : "";
  $("foot-right").textContent = S.backend.kind === "demo" ? "Demo tickets are stored in this browser only." : "";
}

/* ---------- board interactions ---------- */
$("board").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "samples") return addTickets(EXAMPLES.map(([, t]) => t), $("queue"));
  if (act === "clear-filters") { $("q").value = ""; $("category").value = ""; return refresh(); }
  const card = e.target.closest(".card");
  if (card) openDrawer(card.dataset.id);
});
$("lanetabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-lane]"); if (!b) return;
  S.lane = b.dataset.lane; renderBoard();
});
let searchTimer;
$("q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(refresh, 220); });
$("category").addEventListener("change", refresh);

/* ---------- drawer ---------- */
let lastFocus = null;
async function openDrawer(id) {
  S.selected = id; lastFocus = document.activeElement;
  let job = S.jobs.find((j) => j.id === id);
  try { job = await S.backend.get(id); } catch (e) { if (!job) return toast(e.message, true); }
  renderDrawer(job);
  $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").classList.add("open");
  $("drawer-close").focus();
  renderBoard();
}
function closeDrawer() {
  if (!S.selected) return;
  S.selected = null;
  $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").classList.remove("open");
  renderBoard();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
$("drawer-close").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;

function tagHTML(r, note) {
  return `<div class="tag" style="--tone:var(--${r.urgency.toLowerCase()})">
    <div class="head"><span class="urg">${esc(r.urgency)}</span><span class="pill">${esc(r.category)}</span><span class="pill">${esc(r.sentiment)} tone</span></div>
    <dl><dt>Summary</dt><dd>${esc(r.summary)}</dd><dt>Next step</dt><dd>${esc(r.action_item)}</dd></dl>
    ${note ? `<p class="note">${note}</p>` : ""}</div>`;
}

function renderDrawer(j) {
  const statusText = { queued: "Waiting to be triaged", processing: "Triaging now", completed: "Triaged", failed: "Triage failed" }[j.status];
  $("drawer-title").textContent = statusText;
  const meta = [
    ["Added", new Date(j.created_at).toLocaleString()],
    j.completed_at && ["Finished", new Date(j.completed_at).toLocaleString()],
    j.duration_ms != null && ["Took", j.duration_ms >= 1000 ? `${(j.duration_ms / 1000).toFixed(1)} s` : `${j.duration_ms} ms`],
    ["Attempts", j.attempts],
    ["Ticket ID", `<code>${esc(j.id)}</code>`],
  ].filter(Boolean);
  $("drawer-body").innerHTML = `
    ${j.result ? tagHTML(j.result) : ""}
    ${j.error ? `<div><h4>What went wrong</h4><p class="err" style="margin:0">${esc(j.error)}</p></div>` : ""}
    <div><h4>Original message</h4><div class="quote">${esc(j.text)}</div></div>
    <dl class="meta">${meta.map(([k, v]) => `<dt>${k}</dt><dd>${typeof v === "string" && v.startsWith("<code>") ? v : esc(v)}</dd>`).join("")}</dl>
    ${j.metadata && Object.keys(j.metadata).length ? `<div><h4>Metadata</h4><pre>${esc(JSON.stringify(j.metadata, null, 2))}</pre></div>` : ""}`;
  const done = j.status === "completed" || j.status === "failed";
  $("drawer-actions").innerHTML = `
    ${j.result ? `<button class="btn" type="button" data-act="copy">Copy as JSON</button>` : ""}
    ${done ? `<button class="btn" type="button" data-act="retry">Triage again</button>` : ""}
    <button class="btn danger" type="button" data-act="delete">Delete</button>`;
  $("drawer-actions").dataset.id = j.id;
}

$("drawer-actions").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const id = $("drawer-actions").dataset.id;
  const job = S.jobs.find((j) => j.id === id);
  try {
    if (btn.dataset.act === "copy") {
      await navigator.clipboard.writeText(JSON.stringify(job.result, null, 2));
      toast("Copied the triage result.");
    } else if (btn.dataset.act === "retry") {
      await S.backend.retry(id); toast("Sent back for triage."); await refresh();
    } else if (btn.dataset.act === "delete") {
      if (!btn.classList.contains("armed")) {
        btn.classList.add("armed"); btn.textContent = "Click again to delete";
        setTimeout(() => { if (document.contains(btn)) { btn.classList.remove("armed"); btn.textContent = "Delete"; } }, 3000);
        return;
      }
      await S.backend.remove(id); closeDrawer(); toast("Ticket deleted."); await refresh();
    }
  } catch (err) { toast(err.message, true); }
});

/* ---------- composer ---------- */
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
$("kbd").textContent = isMac ? "⌘↵" : "Ctrl+↵";
EXAMPLES.forEach(([label, text]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = label; b.title = text;
  b.onclick = () => {
    const ta = $("text");
    ta.value = S.many && ta.value.trim() ? ta.value.replace(/\s*$/, "\n") + text : text;
    ta.focus(); updateCount();
  };
  $("examples").appendChild(b);
});

function setMany(many) {
  S.many = many;
  $("mode-one").setAttribute("aria-pressed", String(!many));
  $("mode-many").setAttribute("aria-pressed", String(many));
  $("analyze").hidden = many;
  $("text").placeholder = many ? "Paste several tickets, one per line…" : "Paste a support ticket, email or chat message…";
  $("mode-hint").textContent = many ? "Each non-empty line becomes its own ticket on the board."
    : "Added tickets are triaged in the background and land in a lane on the board.";
  updateCount();
}
$("mode-one").onclick = () => setMany(false);
$("mode-many").onclick = () => setMany(true);

function ticketsFromInput() {
  const v = $("text").value;
  return S.many ? v.split("\n").map((s) => s.trim()).filter(Boolean) : (v.trim() ? [v.trim()] : []);
}
function updateCount() {
  const n = ticketsFromInput().length, len = $("text").value.length;
  $("count").textContent = S.many ? (n ? `${n} ticket${n === 1 ? "" : "s"}` : "")
    : (len ? `${len.toLocaleString()} / ${MAX_TEXT.toLocaleString()} characters` : "");
  $("queue").firstChild.textContent = S.many && n > 1 ? `Add ${n} tickets ` : "Add to board ";
}
$("text").addEventListener("input", updateCount);

async function busy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true; btn.textContent = "Working…";
  try { await fn(); return true; } catch (e) { toast(e.message, true); return false; }
  finally { btn.disabled = false; btn.innerHTML = html; updateCount(); }
}

function addTickets(texts, btn) {
  return busy(btn, async () => {
    if (!texts.length) throw new Error(S.many ? "Paste at least one ticket, one per line." : "Write or paste a ticket first.");
    const made = await S.backend.create(texts);
    made.forEach((j) => S.seen.set(j.id, j.status));
    S.lane = "Incoming";
    toast(made.length === 1 ? "Added to the board. Triage has started." : `Added ${made.length} tickets. Triage has started.`);
    $("instant").classList.remove("show");
    await refresh();
  });
}
$("queue").onclick = async () => {
  if (await addTickets(ticketsFromInput(), $("queue"))) { $("text").value = ""; updateCount(); }
};
$("analyze").onclick = () => busy($("analyze"), async () => {
  const [text] = ticketsFromInput();
  if (!text) throw new Error("Write or paste a ticket first.");
  const r = await S.backend.analyze(text);
  $("instant").innerHTML = tagHTML(r, "Not saved to the board. Use “Add to board” to keep it.");
  $("instant").classList.add("show");
});

/* ---------- export ---------- */
$("export").onclick = () => {
  if (!S.jobs.length) return toast("There's nothing to export yet.", true);
  const cols = ["id", "status", "category", "urgency", "sentiment", "summary", "action_item", "text", "created_at", "error"];
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = S.jobs.map((j) => [j.id, j.status, j.result?.category, j.result?.urgency, j.result?.sentiment,
    j.result?.summary, j.result?.action_item, j.text, j.created_at, j.error].map(cell).join(","));
  const blob = new Blob([[cols.join(","), ...rows].join("\n")], { type: "text/csv" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `triaxa-${new Date().toISOString().slice(0, 10)}.csv` });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${S.jobs.length} ticket${S.jobs.length === 1 ? "" : "s"}.`);
};

/* ---------- settings ---------- */
function syncServerFields() {
  $("server-fields").hidden = document.querySelector('input[name="mode"]:checked')?.value !== "server";
}
function openSettings() {
  const conn = savedConn();
  const mode = conn?.mode || S.backend?.kind || "demo";
  document.querySelector(`input[name="mode"][value="${mode}"]`).checked = true;
  $("s-url").value = conn?.url ?? (S.backend?.kind === "server" ? S.backend.base : "http://127.0.0.1:8000");
  $("s-key").value = conn?.key || "";
  $("test-result").textContent = "";
  syncServerFields();
  $("settings").showModal();
}
window.openSettings = openSettings;
$("conn").onclick = openSettings;
document.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener("change", syncServerFields));
$("s-test").onclick = async () => {
  $("test-result").textContent = "Testing…"; $("test-result").className = "test-result";
  const h = await new ServerBackend($("s-url").value.trim(), $("s-key").value).ready();
  $("test-result").textContent = h.ok ? `Connected: ${h.label}` : h.label;
  $("test-result").className = "test-result " + (h.ok ? "" : "err");
};
$("settings").addEventListener("close", async () => {
  if ($("settings").returnValue !== "save") return;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const url = $("s-url").value.trim();
  if (mode === "server" && url && !/^https?:\/\//.test(url)) return toast("Server address must start with http:// or https://", true);
  store.set("triaxa.conn", { mode, url, key: $("s-key").value });
  closeDrawer(); S.seen.clear(); S.firstLoad = true;
  await connect();
  toast(mode === "demo" ? "Switched to demo mode." : `Connected to ${url || "this server"}.`);
});

/* ---------- theme ---------- */
const ICONS = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};
function currentTheme() {
  return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function paintThemeButton() {
  const t = currentTheme();
  $("theme").innerHTML = t === "dark" ? ICONS.light : ICONS.dark;
  $("theme").setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
}
const savedTheme = store.get("triaxa.theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
paintThemeButton();
$("theme").onclick = () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("triaxa.theme", next); paintThemeButton();
};

/* ---------- toasts & keys ---------- */
function toast(msg, bad = false) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("toasts").appendChild(t); setTimeout(() => t.remove(), bad ? 5000 : 2800);
}
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement === $("text")) { e.preventDefault(); $("queue").click(); }
  else if (e.key === "Escape" && S.selected && !$("settings").open) closeDrawer();
  else if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); }
});

/* ---------- polling (server mode) ---------- */
let tick = 0;
setInterval(() => {
  if (document.hidden || !S.backend || S.backend.kind !== "server") return;
  const working = S.jobs.some((j) => j.status === "queued" || j.status === "processing");
  if (working || ++tick % 4 === 0) refresh();   // 1.5 s while tickets are in progress, 6 s otherwise
}, 1500);
setInterval(() => { if (!document.hidden && S.backend) checkHealth(); }, 20000);
setInterval(() => { if (!document.hidden && S.backend?.kind === "demo") renderBoard(); }, 60000);

updateCount();
connect();
</script>
</body>
</html>
